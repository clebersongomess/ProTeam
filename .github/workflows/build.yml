name: Build, Package and Run JAR

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Variáveis de ambiente para o Spring se conectar ao Supabase
      SPRING_DATASOURCE_URL: ${{ secrets.SUPABASE_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SUPABASE_USER }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}

    steps:
      # 1️⃣ Pegar o código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configurar JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: maven

      # 3️⃣ Build do projeto
      - name: Build with Maven
        run: mvn clean package spring-boot:repackage -DskipTests

      # 4️⃣ Rodar a aplicação para testar conexão com banco
      - name: Run Spring Boot Application
        run: java -jar target/gestao-projetos-1.0-SNAPSHOT.jar
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SUPABASE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SUPABASE_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}

      # 5️⃣ Upload do JAR como artefato
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestao-projetos-jar
          path: target/*.jar
