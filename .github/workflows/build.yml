name: Build, Test and Package JAR

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Run Spring Boot (integration test)
        run: java -jar target/gestao-projetos-1.0-SNAPSHOT.jar
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SUPABASE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SUPABASE_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestao-projetos-jar
          path: target/*.jar
