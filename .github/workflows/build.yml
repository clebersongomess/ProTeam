name: Build and Package JAR

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Variáveis de ambiente para o Spring se conectar ao Supabase
      SPRING_DATASOURCE_URL: ${{ secrets.SUPABASE_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SUPABASE_USER }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: maven

      - name: Build with Maven
        run: mvn clean package spring-boot:repackage -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestao-projetos-jar
          path: target/*.jar
